name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: encuestas_tests
          MARIADB_USER: test
          MARIADB_PASSWORD: local-ci-only
          MARIADB_ROOT_PASSWORD: local-ci-root-only
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      FLASK_CONFIG: development
      SECRET_KEY: ci-session-key-only-never-production
      IDENTITY_HMAC_KEY: ci-identity-key-only-never-production
      DATABASE_URL: mysql+pymysql://test:local-ci-only@127.0.0.1:3306/encuestas_tests
      TEST_DATABASE_URL: mysql+pymysql://test:local-ci-only@127.0.0.1:3306/encuestas_tests
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m flask --app wsgi:app db upgrade -d migrations
      - run: python -m pytest -q
      # Upstream Connector/C advisory; Docker build enforces the patched native version.
      - run: python -m pip_audit --no-deps --disable-pip -r requirements.lock --ignore-vuln PYSEC-2026-217
      - run: docker build -t encuestas-backend:ci .
